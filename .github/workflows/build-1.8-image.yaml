name: Build 1.8 Branch Image

on:
  workflow_dispatch:
  push:
    branches:
      - '1.8'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: quay.io
  REGISTRY_IMAGE: mmascia/rhdh
  # Enable Docker experimental features for squash support
  DOCKER_CLI_EXPERIMENTAL: enabled

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          # Remove unnecessary tools and files
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/julia*
          
          # Clean package manager cache
          sudo apt-get clean
          sudo apt-get autoremove -y
          
          # Clean docker
          docker system prune -af --volumes || true
          
          echo "Disk space after cleanup:"
          df -h

      # Restore yarn cache before Docker build
      - name: Restore yarn cache
        id: cache-yarn-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # Option 1: Build with BuildKit and maximum compression (recommended)
      - name: Build and Push
        id: docker-build
        uses: docker/build-push-action@v5
        timeout-minutes: 90
        with:
          push: true
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:1.8
            ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:1.8-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:latest
          # Use registry cache to avoid local storage
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:buildcache,mode=max
          build-args: |
            BUILDKIT_PROGRESS=plain
            DOCKER_BUILDKIT=1
          # BuildKit optimization: max compression and min layers
          outputs: type=image,push=true,compression=gzip,compression-level=9,force-compression=true

      # Option 2: Alternative - Build with legacy builder and squash (uncomment if needed)
      # - name: Build with Squash (Legacy Builder)
      #   run: |
      #     # Disable BuildKit to use legacy builder with squash
      #     export DOCKER_BUILDKIT=0
      #     
      #     # Build with squash flag (experimental)
      #     docker build \
      #       --squash \
      #       -t ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:1.8 \
      #       -t ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:1.8-${{ github.sha }} \
      #       -t ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:latest \
      #       -f ./docker/Dockerfile \
      #       .
      #     
      #     # Push all tags
      #     docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:1.8
      #     docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:1.8-${{ github.sha }}
      #     docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:latest

      # Save yarn cache after successful build
      - name: Save yarn cache
        if: steps.cache-yarn-restore.outputs.cache-hit != 'true' && steps.docker-build.outcome == 'success'
        id: cache-yarn-save
        uses: actions/cache/save@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ steps.cache-yarn-restore.outputs.cache-primary-key }}

      - name: Final cleanup
        if: always()
        run: |
          docker system prune -af --volumes || true
          echo "Final disk space:"
          df -h